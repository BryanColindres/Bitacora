<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Bitácora de apoyo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=13">
</head>
<body>

<!-- LOGIN -->
<section id="login" class="login hidden">
  <form id="loginForm" class="card login-card">
    <div class="brand big"><span class="dot"></span> Bitácora de apoyo</div>
    <p class="muted">Inicia sesión para ver tus registros.</p>
    <label>Correo
      <input type="email" id="loginEmail" autocomplete="username" required>
    </label>
    <label>Contraseña
      <input type="password" id="loginPass" autocomplete="current-password" required>
    </label>
    <button class="btn primary" type="submit">Entrar</button>
    <p id="loginMsg" class="msg"></p>
  </form>
</section>

<!-- APP -->
<div id="app" class="hidden">
  <header class="topbar no-print">
    <div class="brand"><span class="dot"></span> Bitácora</div>
    <nav class="tabs">
      <button data-view="grabar" class="tab active">🎙️ Grabar</button>
      <button data-view="ninos" class="tab">🧒 Niños</button>
      <button data-view="resumen" class="tab">📊 Resumen</button>
    </nav>
    <button id="btnSalir" class="btn ghost small">Salir</button>
  </header>

  <main id="main" class="wrap"></main>
</div>

<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/app.js?v=13"></script>
</body>
</html>
