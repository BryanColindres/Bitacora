<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Bitácora de apoyo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style id="ocultar">body{visibility:hidden}</style>
</head>
<body>

<!-- LOGIN -->
<section id="login" class="login hidden">
  <form id="loginForm" class="card login-card">
    <div class="brand big"><span class="dot"></span> Bitácora de apoyo</div>
    <p class="muted">Inicia sesión para ver tus registros.</p>
    <label>Correo
      <input type="email" id="loginEmail" autocomplete="username" required>
    </label>
    <label>Contraseña
      <input type="password" id="loginPass" autocomplete="current-password" required>
    </label>
    <button class="btn primary" type="submit">Entrar</button>
    <p id="loginMsg" class="msg"></p>
  </form>
</section>

<!-- APP -->
<div id="app" class="hidden">
  <header class="topbar no-print">
    <div class="brand"><span class="dot"></span> Bitácora</div>
    <nav class="tabs">
      <button data-view="grabar" class="tab active">🎙️ Grabar</button>
      <button data-view="ninos" class="tab">🧒 Niños</button>
      <button data-view="resumen" class="tab">📊 Resumen</button>
    </nav>
    <button id="btnSalir" class="btn ghost small">Salir</button>
  </header>

  <main id="main" class="wrap"></main>
</div>

<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* Cargador: lee version.txt sin caché para que los cambios lleguen sin cambiar el enlace. */
(async () => {
  const mostrar = () => { const o = document.getElementById("ocultar"); if (o) o.remove(); };
  setTimeout(mostrar, 4000);
  let v = "0";
  try { const r = await fetch("version.txt", { cache: "no-store" }); if (r.ok) v = (await r.text()).trim() || "0"; } catch (e) {}
  const css = document.createElement("link");
  css.rel = "stylesheet"; css.href = "css/styles.css?v=" + v; document.head.appendChild(css);
  await new Promise(ok => { css.onload = css.onerror = ok; setTimeout(ok, 3000); });
  mostrar();
  for (const src of ["js/config.js", "js/app.js"])
    await new Promise(ok => { const s = document.createElement("script"); s.src = src + "?v=" + v; s.onload = s.onerror = ok; document.body.appendChild(s); });
})();
</script>
</body>
</html>
